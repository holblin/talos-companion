name: Verify
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise run secrets:check
  unraid-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate and validate template-only repository contents
        shell: pwsh
        run: ./scripts/prepare-unraid.ps1 -DockerHubNamespace holblin -TemplateRepository holblin/talos-companion-unraid -OutputDirectory dist/community-apps
      - name: Keep user setup in the app wizard
        run: node --test tests/docker-interface.mjs
      - name: Check owner provisioning shell
        run: bash -n scripts/home-setup.sh
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run web:install
      - run: mise run web:check
      - run: mise run check
      - run: mise run test
  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [both, cloudflare, tailscale, minimal]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg CONNECTORS="$VARIANT" -t talos-companion:ci .
      - name: Verify separate connector and application layers
        run: |
          test "$(docker image inspect talos-companion:ci --format '{{len .RootFS.Layers}}')" = 2
          docker save -o /tmp/companion-image.tar talos-companion:ci
          python3 scripts/verify_image.py /tmp/companion-image.tar "$VARIANT"
      - name: Container smoke test
        run: |
          mkdir -p /tmp/companion-data
          sudo chown 99:100 /tmp/companion-data
          docker run -d --name companion -p 8080:8080 \
            -v /tmp/companion-data:/data --read-only --cap-drop ALL \
            -e PUBLIC_URL=http://localhost:8080 \
            -e SETUP_TOKEN=ci-setup-token-at-least-24-characters \
            -e BACKUP_PASSPHRASE=ci-backup-passphrase-at-least-16 \
            talos-companion:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break || sleep 1; done
          curl -fsS http://localhost:8080/ | grep 'Talos Companion'
          docker exec companion /talos-companion --healthcheck
          docker rm -f companion
      - name: Verify automatic private startup secrets
        run: |
          mkdir -p /tmp/companion-auto
          sudo chown 99:100 /tmp/companion-auto
          sudo chmod 700 /tmp/companion-auto
          docker run -d --name companion-auto -p 8080:8080 \
            -v /tmp/companion-auto:/data --read-only --cap-drop ALL \
            -e PUBLIC_URL=http://localhost:8080 talos-companion:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break || sleep 1; done
          docker exec companion-auto /talos-companion --healthcheck
          for name in setup-token backup-passphrase; do
            sudo test -s "/tmp/companion-auto/$name"
            test "$(sudo stat -c '%a:%u:%g' "/tmp/companion-auto/$name")" = '600:99:100'
          done
          docker rm -f companion-auto
      - name: Verify bundled connection service
        if: matrix.variant != 'minimal'
        run: |
          if [[ "$VARIANT" == both || "$VARIANT" == cloudflare ]]; then
            docker run --rm --entrypoint /usr/local/bin/cloudflared talos-companion:ci version
          fi
          if [[ "$VARIANT" == both || "$VARIANT" == tailscale ]]; then
            docker run --rm --entrypoint /usr/local/bin/tailscaled talos-companion:ci --version
          fi
          docker run -d --name connections-ci --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges talos-companion:ci
          sleep 5
          docker exec connections-ci /talos-companion --connection-agent-healthcheck
          test "$(docker inspect connections-ci --format '{{.Config.User}}')" = '99:100'
          docker rm -f connections-ci
      - name: Package the verified image for the private release workflow
        if: github.event_name == 'workflow_dispatch'
        run: |
          gzip -c /tmp/companion-image.tar > /tmp/companion-image.tar.gz
      - name: Verify pinned Tailscale LocalAPI contract without a tailnet
        if: matrix.variant == 'both' || matrix.variant == 'tailscale'
        run: |
          mkdir -p /tmp/tailscale-api
          sudo chown 99:100 /tmp/tailscale-api
          docker run -d --name tailscale-api --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /usr/local/bin/tailscaled \
            -v /tmp/tailscale-api:/data talos-companion:ci \
            --tun=userspace-networking --state=/data/tailscaled.state \
            --statedir=/data --socket=/data/tailscale.sock
          sudo python3 scripts/verify_tailscale_api.py /tmp/tailscale-api/tailscale.sock
          docker rm -f tailscale-api
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: verified-linux-amd64-image-${{ matrix.variant }}
          path: /tmp/companion-image.tar.gz
          retention-days: 1
          compression-level: 0
